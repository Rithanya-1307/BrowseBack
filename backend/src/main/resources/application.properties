# BrowseBack Spring Boot Application Properties
server.port=8080
# Bind to all interfaces so localhost (both IPv4 127.0.0.1 and IPv6 ::1) connects cleanly
# server.address=127.0.0.1
spring.application.name=browseback-backend

# File-based H2 Database Persistence (Survives server restarts)
spring.datasource.url=jdbc:h2:file:./data/browseback;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Configuration
browseback.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# JSON Formatter
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true
