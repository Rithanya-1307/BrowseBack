<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrowseBack — Chrome History Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5l4 2"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">BrowseBack</h1>
          <p class="brand-subtitle">Chrome History Sync</p>
        </div>
      </div>
      <div id="backendStatusBadge" class="status-badge status-checking">
        <span class="status-dot"></span>
        <span id="backendStatusText">Checking...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Status Banner / Notification -->
      <div id="notification" class="notification hidden" role="alert"></div>

      <!-- Quick Stats Card -->
      <div class="stats-card">
        <div class="stats-row">
          <span class="stats-label">Last Synchronized:</span>
          <span id="lastSyncTimeText" class="stats-value">Never</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Last Import Count:</span>
          <span id="lastImportCountText" class="stats-value">0 visits</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Duplicates Skipped:</span>
          <span id="lastDuplicateCountText" class="stats-value">0</span>
        </div>
      </div>

      <!-- Sync Controls -->
      <div class="form-group">
        <label for="timeRangeSelect" class="form-label">Import Time Range</label>
        <select id="timeRangeSelect" class="form-select">
          <option value="86400000">Past 24 Hours</option>
          <option value="604800000" selected>Past 7 Days (Recommended)</option>
          <option value="2592000000">Past 30 Days</option>
          <option value="7776000000">Past 90 Days</option>
          <option value="0">All Time (Full Sync)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="maxItemsSelect" class="form-label">Batch Limit</label>
        <select id="maxItemsSelect" class="form-select">
          <option value="100">100 items</option>
          <option value="250" selected>250 items</option>
          <option value="500">500 items</option>
          <option value="1000">1,000 items</option>
          <option value="2500">2,500 items</option>
          <option value="5000">5,000 items</option>
        </select>
      </div>

      <!-- Auto-Sync Toggle -->
      <div class="toggle-group">
        <div class="toggle-info">
          <span class="toggle-title">Real-Time Visit Sync</span>
          <span class="toggle-desc">Automatically forward new research visits as you browse</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoSyncToggle">
          <span class="slider round"></span>
        </label>
      </div>

      <!-- Action Button -->
      <button id="syncNowBtn" class="btn btn-primary" type="button">
        <svg id="syncIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        <span id="syncBtnText">Sync Chrome History Now</span>
      </button>

      <!-- Web App Link -->
      <button id="openWebAppBtn" class="btn btn-secondary" type="button">
        <span>Open BrowseBack App</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>

      <!-- Expandable Backend Settings -->
      <details class="settings-details">
        <summary class="settings-summary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Backend Configuration</span>
        </summary>
        <div class="settings-content">
          <label for="backendUrlInput" class="form-label">Spring Boot Server URL</label>
          <div class="url-input-row">
            <input type="text" id="backendUrlInput" class="form-input" value="http://localhost:8080" spellcheck="false">
            <button id="saveBackendUrlBtn" class="btn btn-sm btn-outline" type="button">Save</button>
          </div>
        </div>
      </details>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="privacy-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>100% Local: No third-party servers or telemetry.</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
